name: Validate APM packages

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover:
    name: Repository validation
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
      count: ${{ steps.packages.outputs.count }}
      apm-version: ${{ steps.packages.outputs.apm-version }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository contracts
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python tools/validate_repo.py --base "$BASE_REF"
          else
            python tools/validate_repo.py
          fi

      - name: Build affected-package matrix
        id: packages
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            matrix=$(python tools/package_matrix.py --base "$BASE_REF")
          else
            matrix=$(python tools/package_matrix.py)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          MATRIX="$matrix" python -c 'import json, os; print("count=" + str(len(json.loads(os.environ["MATRIX"])["include"])))' >> "$GITHUB_OUTPUT"
          python -c 'import yaml; print("apm-version=" + str(yaml.safe_load(open("atlas.yml"))["apm_version"]))' >> "$GITHUB_OUTPUT"

  packages:
    name: APM package validation (${{ matrix.name }})
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Install pinned APM CLI
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          setup-only: "true"
          apm-version: ${{ needs.discover.outputs.apm-version }}

      - name: Scan publishable files
        if: matrix.kind == 'skill'
        run: apm audit --file "${{ matrix.path }}/.apm/skills/${{ matrix.name }}/SKILL.md"

      - name: Smoke-install in a clean Kiro project
        run: python tools/smoke_install.py --package "${{ matrix.path }}"
