name: Sync atlas-all kit

on:
  workflow_run:
    workflows:
      - Release APM packages
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-atlas-all
  cancel-in-progress: false

jobs:
  sync:
    name: Open kit update PR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Synchronize released skills
        id: sync
        run: |
          python tools/sync_kit.py
          if git diff --quiet -- kits/all; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch and open pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/sync-atlas-all-${{ github.run_id }}
        run: |
          git config user.name "atlas-ai-release-bot"
          git config user.email "atlas-ai-release-bot@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add kits/all/apm.yml kits/all/CHANGELOG.md
          git commit -m "chore(atlas-all): sync released skills"
          git push origin "$BRANCH_NAME"
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore(atlas-all): sync released skills" \
            --body "Atualiza o kit completo para o conjunto de skills oficialmente publicado. A PR permanece sujeita aos checks e revisões obrigatórios."
